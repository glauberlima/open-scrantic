[package]
name = "open-scrantic"
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
description = "Reverse-engineered reimplementation of Sierra/Dynamix 'Screen Antics: Johnny Castaway' (1992), running on the original data files"
license = "MIT"
readme = "README.md"
repository = "https://github.com/glauberlima/open-scrantic"
keywords = ["johnny-castaway", "screensaver", "reverse-engineering", "retro", "reimplementation"]
categories = ["emulators", "multimedia"]
publish = false

[dependencies]
chrono = "0.4.45"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
softbuffer = "0.4.8"
winit = "0.30.13"

[features]
# Windows only: builds the screensaver (`.scr`) flavor, which understands just the switches Windows passes.
screensaver = ["dep:windows-sys"]

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Zero-warning policy: any compiler or clippy warning fails the build.
# `unsafe` is denied crate-wide; only `windows_ui` (Win32 calls) allows it.
[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[target."cfg(windows)".build-dependencies]
embed-resource = "3.0.12"
