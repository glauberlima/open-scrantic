name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      skipped: ${{ steps.next.outputs.skipped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: git-cliff@2.14.2
      - name: Compute next version
        id: next
        run: |
          LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
          UNRELEASED=$(git cliff --unreleased --strip all | tr -d '[:space:]')
          if [ -z "$UNRELEASED" ]; then
            echo "No releasable commits since ${LAST:-the beginning}. Skipping."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG=$(git cliff --bumped-version)
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Unexpected version '$TAG'" >&2
            exit 1
          fi
          echo "Next version: $TAG (last: ${LAST:-none})"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS universal
    needs: plan
    if: needs.plan.outputs.skipped != 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --release --target x86_64-apple-darwin
      - run: cargo build --locked --release --target aarch64-apple-darwin
      - name: Create universal binary
        run: |
          lipo -create \
            target/x86_64-apple-darwin/release/open-scrantic \
            target/aarch64-apple-darwin/release/open-scrantic \
            -output open-scrantic-macos
          lipo -info open-scrantic-macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: open-scrantic-macos
          path: open-scrantic-macos

  build-linux:
    name: Build Linux x64
    needs: plan
    if: needs.plan.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --release
      - run: cp target/release/open-scrantic open-scrantic-linux-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: open-scrantic-linux-x64
          path: open-scrantic-linux-x64

  build-windows:
    name: Build Windows x64
    needs: plan
    if: needs.plan.outputs.skipped != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --release
      - run: cp target/release/open-scrantic.exe open-scrantic-windows-x64.exe
      # The screensaver flavor: it understands only the switches Windows passes (see README).
      - run: cargo build --locked --release --features screensaver
      - run: cp target/release/open-scrantic.exe open-scrantic-windows-x64.scr
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: open-scrantic-windows-x64
          path: |
            open-scrantic-windows-x64.exe
            open-scrantic-windows-x64.scr

  # Runs only after every build succeeded, so a failed build never leaves a
  # release commit or tag on main.
  publish:
    name: Publish release
    needs: [plan, build-macos, build-linux, build-windows]
    if: needs.plan.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: git-cliff@2.14.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum open-scrantic-* > checksums.txt
          cat checksums.txt

      - name: Scan binaries with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: bash scripts/virustotal-scan.sh dist/open-scrantic-* > vt-results.txt

      - name: Build release notes
        run: |
          {
            printf '## Security scan\n\nAll binaries were scanned by VirusTotal before this release was published. Binaries are unsigned, so heuristic false positives are possible.\n\n'
            printf '| Binary | Result | Report |\n|--------|--------|--------|\n'
            while IFS='|' read -r name malicious total _ gui_url; do
              [ -z "$name" ] && continue
              printf '| %s | %s/%s engines flagged | [View report](%s) |\n' "$name" "$malicious" "$total" "$gui_url"
            done < vt-results.txt
            printf '\n## Running\n\nThe binary contains only the engine. Place it next to the original `SCRANTIC.SCR`, `RESOURCE.MAP` and `RESOURCE.001` files.\n\n---\n\n'
            git cliff --unreleased --tag "$TAG" --strip header
          } > notes.md
          cat notes.md

      - name: Update version and CHANGELOG
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Unexpected tag '$TAG'" >&2; exit 1 ;; esac
          export VERSION="${TAG#v}"
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          perl -0pi -e 's/(name = "open-scrantic"\nversion = ")[^"]*/$1$ENV{VERSION}/' Cargo.lock
          touch CHANGELOG.md
          git cliff --unreleased --tag "$TAG" --prepend CHANGELOG.md
          git diff --stat

      - name: Commit, tag, and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md Cargo.toml Cargo.lock
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "$TAG"
          # The checkout keeps no credentials; hand the token to this one command only.
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=Authorization: basic $AUTH" push --atomic origin HEAD:main "$TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          body_path: notes.md
          files: |
            dist/open-scrantic-*
            dist/checksums.txt
